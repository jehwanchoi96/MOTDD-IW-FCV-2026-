# SAAC only -- DynUAV.
# Primary detections: benchmark-provided detections distributed with DynUAV (<seq>/det/det.txt).
name: saac
benchmark: DynUAV
tracker: motdd
frame_rate: 30
seed: 42

bytetrack:
  track_thresh: 0.5
  track_buffer: 30
  match_thresh: 0.8
  mot20: false

cmc:                          # ORB + MAGSAC++ homography, warps the Kalman priors
  enable: false

saac:                         # alpha(s) = clip((s - 8) / 32, 0, 1), stages 1 and 2
  enable: true
  C: 12.8                      # NWD normalization (px)

pgr:                          # prediction-gated recovery
  enable: false

data:
  seq_root: "{DATA_ROOT}/DynUAV"          # <seq>/seqinfo.ini, <seq>/img1/
  det_file: "{DATA_ROOT}/DynUAV/{seq}/det/det.txt"
  # 11 evaluation sequences (val: 001 014 018 040; test: 004 009 016 027 029 055 067)
  sequences:
    - "001"
    - "004"
    - "009"
    - "014"
    - "016"
    - "018"
    - "027"
    - "029"
    - "040"
    - "055"
    - "067"
