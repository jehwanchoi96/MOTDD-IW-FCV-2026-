# ByteTrack baseline (no CMC, no SAAC, no PGR) -- UAVDT-M.
# Primary detections: YOLOX-s fine-tuned on UAVDT-M (conf 0.001, NMS IoU 0.65).
name: bytetrack
benchmark: UAVDT-M
tracker: bytetrack            # official BYTETracker
frame_rate: 30
seed: 42

bytetrack:
  track_thresh: 0.5
  track_buffer: 30
  match_thresh: 0.8
  mot20: false

data:
  seq_root: "{DATA_ROOT}/UAVDT-M"          # <seq>/seqinfo.ini, <seq>/img1/
  det_file: "{DET_ROOT}/UAVDT-M/{seq}.txt"
  # 20 test sequences
  sequences:
    - "M0203"
    - "M0205"
    - "M0208"
    - "M0209"
    - "M0403"
    - "M0601"
    - "M0602"
    - "M0606"
    - "M0701"
    - "M0801"
    - "M0802"
    - "M1001"
    - "M1004"
    - "M1007"
    - "M1009"
    - "M1101"
    - "M1301"
    - "M1302"
    - "M1303"
    - "M1401"
