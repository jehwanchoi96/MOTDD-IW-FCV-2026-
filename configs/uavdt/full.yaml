# Full system: CMC + SAAC + PGR -- UAVDT-M.
# Primary detections: YOLOX-s fine-tuned on UAVDT-M (conf 0.001, NMS IoU 0.65).
name: full
benchmark: UAVDT-M
tracker: motdd
frame_rate: 30
seed: 42

bytetrack:
  track_thresh: 0.5
  track_buffer: 30
  match_thresh: 0.8
  mot20: false

cmc:                          # ORB + MAGSAC++ homography, warps the Kalman priors
  enable: true
  max_features: 1000
  min_inliers: 20             # identity homography below this inlier count

saac:                         # alpha(s) = clip((s - 8) / 32, 0, 1), stages 1 and 2
  enable: true
  C: 12.8                      # NWD normalization (px)

pgr:                          # prediction-gated recovery
  enable: true
  K: 4                         # candidate-track budget per frame
  crop_scale: 8.0              # crop side = max(crop_scale * sqrt(area), min_crop)
  min_crop: 128                # s_min (px)
  input_size: [640, 640]       # letterbox size of the crop
  conf_thresh: 0.1             # recovery confidence threshold
  nms_thresh: 0.65
  dedup_iou: 0.5               # tau_dedup vs. detections matched this frame
  double_count_iou: 0.3        # stricter overlap guard vs. matched detections
  gate_iou: 0.3                # tau_gate on the buffered IoU
  gate_buffer_ratio: 0.2       # r of BIoU_r
  fp16: true                   # half precision when the detector runs on CUDA

detector:                     # PGR detector: same YOLOX-s weights as the primary detections
  exp: configs/detectors/yoloxs_uavdt_m.py
  weights: "{WEIGHTS_ROOT}/yoloxs_uavdt_m.pth"

data:
  seq_root: "{DATA_ROOT}/UAVDT-M"          # <seq>/seqinfo.ini, <seq>/img1/
  det_file: "{DET_ROOT}/UAVDT-M/{seq}.txt"
  # 20 test sequences
  sequences:
    - "M0203"
    - "M0205"
    - "M0208"
    - "M0209"
    - "M0403"
    - "M0601"
    - "M0602"
    - "M0606"
    - "M0701"
    - "M0801"
    - "M0802"
    - "M1001"
    - "M1004"
    - "M1007"
    - "M1009"
    - "M1101"
    - "M1301"
    - "M1302"
    - "M1303"
    - "M1401"
