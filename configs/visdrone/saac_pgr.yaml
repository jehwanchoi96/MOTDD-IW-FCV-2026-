# SAAC + PGR (no CMC) -- VisDrone-MOT.
# Primary detections: YOLOX-s fine-tuned on VisDrone-MOT (conf 0.001, NMS IoU 0.65).
name: saac_pgr
benchmark: VisDrone-MOT
tracker: motdd
frame_rate: 30
seed: 42

bytetrack:
  track_thresh: 0.5
  track_buffer: 30
  match_thresh: 0.8
  mot20: false

cmc:                          # ORB + MAGSAC++ homography, warps the Kalman priors
  enable: false

saac:                         # alpha(s) = clip((s - 8) / 32, 0, 1), stages 1 and 2
  enable: true
  C: 12.8                      # NWD normalization (px)

pgr:                          # prediction-gated recovery
  enable: true
  K: 4                         # candidate-track budget per frame
  crop_scale: 8.0              # crop side = max(crop_scale * sqrt(area), min_crop)
  min_crop: 128                # s_min (px)
  input_size: [640, 640]       # letterbox size of the crop
  conf_thresh: 0.1             # recovery confidence threshold
  nms_thresh: 0.65
  dedup_iou: 0.5               # tau_dedup vs. detections matched this frame
  double_count_iou: 0.3        # stricter overlap guard vs. matched detections
  gate_iou: 0.3                # tau_gate on the buffered IoU
  gate_buffer_ratio: 0.2       # r of BIoU_r
  fp16: true                   # half precision when the detector runs on CUDA

detector:                     # PGR detector: same YOLOX-s weights as the primary detections
  exp: configs/detectors/yoloxs_visdrone_mot.py
  weights: "{WEIGHTS_ROOT}/yoloxs_visdrone_mot.pth"

data:
  seq_root: "{DATA_ROOT}/VisDrone-MOT-test-dev"          # <seq>/seqinfo.ini, <seq>/img1/
  det_file: "{DET_ROOT}/VisDrone-MOT/{seq}.txt"
  # 17 test-dev sequences
  sequences:
    - "uav0000009_03358_v"
    - "uav0000073_00600_v"
    - "uav0000073_04464_v"
    - "uav0000077_00720_v"
    - "uav0000088_00290_v"
    - "uav0000119_02301_v"
    - "uav0000120_04775_v"
    - "uav0000161_00000_v"
    - "uav0000188_00000_v"
    - "uav0000201_00000_v"
    - "uav0000249_00001_v"
