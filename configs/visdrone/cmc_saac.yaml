# CMC + SAAC -- VisDrone-MOT.
# Primary detections: YOLOX-s fine-tuned on VisDrone-MOT (conf 0.001, NMS IoU 0.65).
name: cmc_saac
benchmark: VisDrone-MOT
tracker: motdd
frame_rate: 30
seed: 42

bytetrack:
  track_thresh: 0.5
  track_buffer: 30
  match_thresh: 0.8
  mot20: false

cmc:                          # ORB + MAGSAC++ homography, warps the Kalman priors
  enable: true
  max_features: 1000
  min_inliers: 20             # identity homography below this inlier count

saac:                         # alpha(s) = clip((s - 8) / 32, 0, 1), stages 1 and 2
  enable: true
  C: 12.8                      # NWD normalization (px)

pgr:                          # prediction-gated recovery
  enable: false

data:
  seq_root: "{DATA_ROOT}/VisDrone-MOT-test-dev"          # <seq>/seqinfo.ini, <seq>/img1/
  det_file: "{DET_ROOT}/VisDrone-MOT/{seq}.txt"
  # 17 test-dev sequences
  sequences:
    - "uav0000009_03358_v"
    - "uav0000073_00600_v"
    - "uav0000073_04464_v"
    - "uav0000077_00720_v"
    - "uav0000088_00290_v"
    - "uav0000119_02301_v"
    - "uav0000120_04775_v"
    - "uav0000161_00000_v"
    - "uav0000188_00000_v"
